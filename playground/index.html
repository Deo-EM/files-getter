<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>files-getter Playground</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 1.5rem;
        padding: 2rem;
        background: #f5f5f5;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
      }
      .buttons {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        padding: 0.625rem 1.25rem;
        font-size: 0.9rem;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #f0f0f0;
      }
      .result {
        max-width: 600px;
        width: 100%;
        background: #fff;
        border-radius: 8px;
        padding: 1rem;
        border: 1px solid #d0d5dd;
        min-height: 3rem;
        font-size: 0.875rem;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .empty {
        color: #999;
      }
    </style>
  </head>
  <body>
    <h1>files-getter Playground</h1>
    <div class="buttons">
      <button type="button" id="btn-single">Pick Single File</button>
      <button type="button" id="btn-multiple">Pick Multiple Files</button>
      <button type="button" id="btn-directory">Pick Directory</button>
    </div>
    <div class="result" id="result"><span class="empty">No files selected yet</span></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
